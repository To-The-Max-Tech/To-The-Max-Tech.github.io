<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>To The Max Tech - Untethered-AI Products</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 980px;
      margin: 0 auto;
      padding: 0 20px;
      background: #111;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #000000 0%, #323134 100%);
      color: white;
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100vw;
      margin-left: calc(50% - 50vw);
      margin-right: calc(50% - 50vw);
      box-sizing: border-box;
      padding: 1.25rem 20px;
    }

    header nav {
      max-width: 980px;
      margin: 0 auto;
    }

    nav ul {
        display: flex;
        justify-content: center;
        list-style: none;
        gap: 1.5rem;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-weight: 500;
        transition: opacity 0.3s;
    }

    nav a:hover {
        opacity: 0.9;
    }

    h1 {
      color: #fff;
      text-align: center;
    }

    h3 {
      color: #ffcc00;
      margin-top: 20px;
    }

    .small { color: #aaa; }

    .price {
      font-weight: bold;
      color: #4caf50;
      font-size: 1.2em;
      margin: 4px 0 0;
    }

    ul { padding-left: 20px; }
    li { margin-bottom: 8px; }

    pre {
      white-space: pre-wrap;
      background: #080808;
      padding: 15px;
      border-radius: 10px;
      min-height: 180px;
      overflow-x: auto;
    }

    /* Whole product tier is clickable and collapses/retracts. */
    .product-tier {
      margin: 20px 0;
      border: 1px solid #333;
      border-radius: 14px;
      overflow: hidden;
      background: #1c1c1c;
    }

    .product-tier > summary {
      list-style: none;
      cursor: pointer;
      background: #2c2c2c;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      user-select: none;
      transition: background 0.2s ease;
    }

    .product-tier > summary::-webkit-details-marker {
      display: none;
    }

    .product-tier > summary:hover {
      background: #383838;
    }

    .tier-title h3 {
      margin: 0;
    }

    .tier-arrow {
      color: #ffcc00;
      font-size: 1.2rem;
      transition: transform 0.25s ease;
    }

    .product-tier[open] .tier-arrow {
      transform: rotate(180deg);
    }

    .tier-content {
      padding: 4px 22px 22px;
    }

    .tier-content h3:first-child {
      margin-top: 18px;
    }

    .card {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .note-card {
      margin-top: 25px;
      padding: 22px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 14px;
    }

    @media (max-width: 640px) {
      body {
        margin: 0 auto;
        padding: 0 12px;
      }

      header {
        padding: 1rem 12px;
      }

      .product-tier > summary {
        padding: 15px;
      }

      .tier-content {
        padding: 4px 15px 15px;
      }

      pre {
        font-size: 0.82rem;
      }
    }
   /* Footer styling */
   footer {
       margin-top: auto;
       padding: 20px 0;
       text-align: center;
       font-size: 0.9em;
   }
   footer p {
       margin: 4px 0;
   }
   footer a {
       color: #4caf50;
       text-decoration: none;
   }
   footer a:hover {
       text-decoration: underline;
   }
</head>
